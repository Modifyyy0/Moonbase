<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_circle,close" />
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>
    <div id="view">
        <div id="side-bar">
            <div id="side-bar-logo">
                <div id="side-bar-logo-container">
                    <img src="assets/images/moonbase-logo.png" alt="">
                </div>
                <p>Moonbase</p>
            </div>

            <div id="new-convo-button">
                <span class="material-symbols-outlined" id="plus-white">add_circle</span>
                <p id="new-convo-button-text">New Conversation</p>
            </div>

            <div id="side-bar-list">
            </div>

            <button id="logout-button">Log Out</button>
        </div>

        <div id="main-convo">
            <div id="no-convo">
                <img src="assets/images/no_convo.svg" alt="">
                <p>You have no conversations right now</p>
                <p>Go start some</p>
            </div>
            <div id="conversation-view" hidden>
                <div id="convo-head">
                    <p id="convo-head-name">Conversation</p>
                    <div id="convo-head-status">
                        <p id="convo-head-online">0 online</p>
                        <p id="convo-head-members">0 members</p>
                    </div>
                </div>
                <div id="convo-body">
                    <div id="main-message-area">
                        <div id="convo-container"></div>
                        <p id="typing-indicator" aria-live="polite"></p>
                        <div id="message-input-box">
                            <textarea id="message-input"
                                placeholder="Message in this conversation, [Enter] to send"></textarea>
                        </div>
                    </div>
                    <div id="info-bar">
                        <div id="info-bar-select">
                            <p id="info-bar-select-members" class="info-bar-select-selected">Members</p>
                            <p id="info-bar-select-info">Info</p>
                        </div>
                        <div id="info-bar-members">
                            <p id="info-bar-online">Online</p>
                            <p id="info-bar-offline">Offline</p>
                        </div>
                        <div id="info-bar-info">
                            <img id="info-bar-convo-pfp" src="assets/images/placeholder.png" alt="">
                            <p id="info-bar-convo-name">Conversation</p>
                            <button id="invite-button">Invite Others</button>
                            <button id="leave-button">Leave Conversation</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="popout">
        <div id="create-conversation-container">
            <div id="create-conversation-top-container">
                <p>Invite people to your new conversation</p>
                <button>
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </button>
            </div>
            <div id="create-conversation-middle-container">
                <div id="create-conversation-type-container">
                    <select id="create-conversation-type">
                        <option value="group">Group Conversation</option>
                        <option value="direct">1:1 Conversation</option>
                    </select>
                </div>
                <input type="text" placeholder="Search for username(s) to invite">
                <div id="create-conversation-user-search">
                    <p>Use the search bar to find users to invite</p>
                </div>
            </div>
            <div id="create-conversation-bottom-container">
                <img src="assets/images/placeholder.png" alt="">
                <input id="create-conversation-name" type="text" placeholder="Group conversation name">
                <button>Create Conversation</button>
            </div>
        </div>
    </div>
    <script src="js/chat.js" type="module"></script>
    <script src="js/rest.js" type="module"></script>
    <script src="js/ws.js" type="module"></script>
</body>

</html>
