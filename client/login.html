<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonbase | Log in</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="container">
        <div id="logo-container">
            <img src="assets/images/loading.gif" alt="">
        </div>
        <div id="text-container">
            <div id="logo-text">
                <p>Moonbase</p>
            </div>
            <div id="login-container">
                <p id="login-text">Sign Up or Log In</p>
                <input id="login-username-input" type="text" placeholder="Enter your username">
                <button id="login-button">Log In</button>
            </div>
        </div>
    </div>

    <script src="js/login.js" type="module"></script>
    <script src="js/rest.js" type="module"></script>
    <script src="js/ws.js" type="module"></script>
</body>
</html>
